# Generic .travis.yml file for running continuous integration on Travis-CI for
# any ROS2 package.
#
# This installs ROS2 on a clean Travis-CI virtual machine, creates a ROS2
# workspace, resolves all listed dependencies, and sets environment variables
# (setup.bash). Then, it compiles the entire ROS2 workspace (ensuring there are
# no compilation errors), and runs all the tests.
#
# Author: Updated for ROS2 Jazzy

# NOTE: The build lifecycle on Travis.ci is something like this:
#    before_install
#    install
#    before_script
#    script
#    after_success or after_failure
#    after_script
#    OPTIONAL before_deploy
#    OPTIONAL deploy
#    OPTIONAL after_deploy

################################################################################

# Use ubuntu noble (24.04) with sudo privileges for ROS2 Jazzy.
dist: noble
sudo: required
language: generic
cache: apt

# Configuration variables for ROS2
env:
  global:
    - ROS_DISTRO=jazzy
    - ROS_CI_DESKTOP="`lsb_release -cs`"  # noble
    - CI_SOURCE_PATH=$(pwd)
    - ROS_PARALLEL_JOBS='-j8 -l6'

################################################################################

# Install system dependencies, namely ROS2 setup.
before_install:
  # Set up locales
  - sudo apt update && sudo apt install -y locales
  - sudo locale-gen en_US en_US.UTF-8
  - sudo update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
  - export LANG=en_US.UTF-8
  # Set up ROS2 repositories
  - sudo apt install -y software-properties-common
  - sudo add-apt-repository universe
  - sudo apt update && sudo apt install -y curl gnupg lsb-release
  - sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
  - sudo apt update
  # Install ROS2 base and build tools
  - sudo apt install -y ros-$ROS_DISTRO-ros-base python3-pip
  - sudo apt install -y python3-colcon-common-extensions
  - sudo apt install -y python3-rosdep
  - sudo rosdep init || true
  - rosdep update

# Create a ROS2 workspace with the package under integration.
install:
  - source /opt/ros/$ROS_DISTRO/setup.bash
  - mkdir -p ~/ros2_ws/src
  - cd ~/ros2_ws/src
  # Add the package under integration to the workspace using a symlink.
  - ln -s $CI_SOURCE_PATH .
  # Install ROS2 dependencies for kitti2bag
  - sudo apt install -y ros-$ROS_DISTRO-cv-bridge ros-$ROS_DISTRO-rosbag2-py ros-$ROS_DISTRO-tf2-ros ros-$ROS_DISTRO-sensor-msgs ros-$ROS_DISTRO-tf-transformations
  # Install Python dependencies
  - pip3 install pykitti progressbar2

# Install all dependencies using rosdep.
before_script:
  - cd ~/ros2_ws
  - source /opt/ros/$ROS_DISTRO/setup.bash
  # Install package dependencies using rosdep
  - rosdep install -y --from-paths src --ignore-src --rosdistro $ROS_DISTRO

# Compile and test (mark the build as failed if any step fails).
script:
  - source /opt/ros/$ROS_DISTRO/setup.bash
  - cd ~/ros2_ws
  # Build the ROS2 workspace
  - colcon build $ROS_PARALLEL_JOBS
  # Source the workspace
  - source install/setup.bash
  # Run tests
  - colcon test
  - colcon test-result --verbose
  # Test the installation and basic functionality
  - cd $CI_SOURCE_PATH
  - mkdir -p $HOME/kitti_test
  - cd $HOME/kitti_test
  # Download a small KITTI dataset for testing
  - wget http://kitti.is.tue.mpg.de/kitti/raw_data/2011_09_26_drive_0048/2011_09_26_drive_0048_sync.zip
  - unzip 2011_09_26_drive_0048_sync.zip
  - wget http://kitti.is.tue.mpg.de/kitti/raw_data/2011_09_26_calib.zip
  - unzip 2011_09_26_calib.zip
  # Test the ROS2 version
  - source ~/ros2_ws/install/setup.bash
  - kitti2bag raw_synced . -t 2011_09_26 -r 0048 -o ./output
